<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEITickets - Sistema de Gestión de Tickets</title>
    <!-- Cache bust: 2025-01-08-16:00 -->
    
    <!-- Favicon NEITickets -->
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/NEITickets.png" />
    
    <!-- Meta tags para SEO -->
    <meta name="description" content="NEITickets - Sistema de gestión de tickets para la Alcaldía de Neiva" />
    <meta name="keywords" content="tickets, soporte técnico, alcaldía, neiva, gestión" />
    <meta name="author" content="NEITickets" />
    
    <!-- Open Graph para redes sociales -->
    <meta property="og:title" content="NEITickets - Sistema de Gestión de Tickets" />
    <meta property="og:description" content="Sistema de gestión de tickets para la Alcaldía de Neiva" />
    <meta property="og:image" content="/NEITickets.png" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Script para forzar título y favicon NEITickets -->
    <script>
      // Forzar título global de NEITickets
      document.title = 'NEITickets - Sistema de Gestión de Tickets';
      
      // Forzar favicon global
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.href = '/favicon.ico';
      document.head.appendChild(favicon);
      
      // Proteger título global
      const originalTitle = 'NEITickets - Sistema de Gestión de Tickets';
      setInterval(() => {
        if (!document.title.includes('NEITickets')) {
          document.title = originalTitle;
        }
      }, 100);
    </script>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
