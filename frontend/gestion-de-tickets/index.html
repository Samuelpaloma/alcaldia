  <body>
    <div id="root"></div>

    <!-- Script para forzar título y favicon -->
    <script>
      // Forzar título inmediatamente
      document.title = 'NEITickets - Sistema de Gestión de Tickets';
      
      // Forzar favicon
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = 'image/png';
      favicon.href = '/NEITickets.png?v=2025-01-08-16:00';
      document.head.appendChild(favicon);
      
      // Prevenir que otros scripts cambien el título
      let originalTitle = 'NEITickets - Sistema de Gestión de Tickets';
      Object.defineProperty(document, 'title', {
        get: function() { return originalTitle; },
        set: function(value) { 
          if (!value.includes('NEITickets')) {
            originalTitle = 'NEITickets - Sistema de Gestión de Tickets';
          } else {
            originalTitle = value;
          }
        }
      });
    </script>

    <script type="module" src="/client/App.tsx"></script>
